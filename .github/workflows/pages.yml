name: Pages

on:
  # Deferred: GitHub Pages is unavailable on a PRIVATE repo on this plan, so the
  # push trigger is disabled to avoid a failing check on every commit. It is
  # re-enabled when the repo goes public (P4); the real WebAssembly build replaces
  # the placeholder at P5 (see ROADMAP.md). Manual dispatch only until then.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

# NOTE: `web/` is a placeholder landing page for now. The real WebAssembly build
# of the app (trunk / wasm-pack) replaces it at P5 (see ROADMAP.md).
