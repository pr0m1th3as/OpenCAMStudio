name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Correctness gates first — these must pass.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      # Formatting is advisory: it runs last and never fails the job, so a cosmetic
      # nit can't mask a real clippy/build/test failure. The diff is still visible in
      # the log if we ever choose to act on it (the codebase is hand-formatted, not
      # rustfmt-shaped — deliberate; revisit adopting rustfmt if collaborators join).
      - name: Format (advisory)
        continue-on-error: true
        run: cargo fmt --all --check

  gui-build:
    name: gui build (iced + wgpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (X11/Wayland/GL/Vulkan/font)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev
      - name: Clippy (gui + gpu)
        run: cargo clippy -p cam-app --features gui -- -D warnings
      - name: Build (gui + gpu)
        run: cargo build -p cam-app --features gui

  licenses:
    name: license check (GPLv3-compat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check licenses
