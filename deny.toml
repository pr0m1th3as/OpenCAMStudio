# cargo-deny configuration — enforces GPL-3.0-only compatibility.
# Only permissive and GPLv3-compatible licenses are allowed; anything else fails CI.

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "GPL-3.0",
    "LGPL-3.0",
    "MPL-2.0",          # weak copyleft, GPLv3-compatible
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
