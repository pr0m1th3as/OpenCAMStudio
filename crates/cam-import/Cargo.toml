[package]
name = "cam-import"
description = "OpenCAMStudio — read CAD geometry (DXF) into cam-geo contours and regions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cam-geo = { path = "../cam-geo" }
# Reads DXF (ASCII + binary) and DWG; MPL-2.0 (GPLv3-compatible). The bundled
# sample still uses the in-crate ASCII reader (`dxf.rs`); real file imports go
# through acadrust via `read_cad_file`.
acadrust = "0.4"

[dev-dependencies]
cam-cldata = { path = "../cam-cldata" }
cam-model = { path = "../cam-model" }
cam-toolpath = { path = "../cam-toolpath" }
cam-post = { path = "../cam-post" }
