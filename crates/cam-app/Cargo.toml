[package]
name = "cam-app"
description = "OpenCAMStudio — CAM application for CNC toolpath generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "opencamstudio"
path = "src/main.rs"

[features]
# The headless app controller builds and tests with no default features. The
# `gui` feature adds the iced desktop shell (and the wgpu renderer), which needs
# a graphics/windowing stack to run.
default = []
gui = ["dep:iced", "dep:wgpu", "dep:rfd", "cam-render/gpu"]

[dependencies]
cam-geo = { path = "../cam-geo" }
cam-cldata = { path = "../cam-cldata" }
cam-model = { path = "../cam-model" }
cam-toolpath = { path = "../cam-toolpath" }
cam-post = { path = "../cam-post" }
cam-import = { path = "../cam-import" }
cam-render = { path = "../cam-render" }
cam-sim = { path = "../cam-sim" }
serde = { workspace = true }
serde_json = { workspace = true }
iced = { version = "0.14", features = ["wgpu", "svg", "canvas"], optional = true }
wgpu = { version = "27", optional = true }
rfd = { version = "0.17", optional = true }

# No click-through licence page in the installer. The GPL is not an EULA: section 9
# is explicit that you need not accept it in order to run the program, so gating
# installation on an "I agree" would misrepresent it. The full text ships inside the
# application instead (About), and in the repository.
[package.metadata.wix]
eula = false

# Windows-only: embeds the icon and VERSIONINFO into the .exe (see build.rs).
# MIT/Apache-2.0, both already allowed by deny.toml.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Test-only: parse the bundled SVG icons so a malformed one fails loudly instead of
# rendering as nothing. MPL-2.0, so GPL-3.0-compatible (as acadrust already is).
roxmltree = "0.20"
