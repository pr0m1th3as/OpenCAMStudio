<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" stroke-linejoin="round" stroke-linecap="round">
  <!-- part cross-section with an AREA carved out of the top face: V-sloped walls
       running down to a flat floor. Deliberately distinct from engrave.svg, whose
       tool ploughs a single narrow groove and never leaves a floor. -->
  <path d="M3 10 L7 10 L10 16 L14 16 L17 10 L21 10 L21 21 L3 21 Z" fill="#e0e0e0" fill-opacity="0.13" stroke="#e0e0e0" stroke-width="1.6"/>
  <!-- the carved surface: two V flanks meeting a cleared flat floor -->
  <path d="M7 10 L10 16 L14 16 L17 10" fill="none" stroke="#4cc9f0" stroke-width="1.8"/>
  <!-- V-bit standing off the boundary, its flank on the wall rather than its tip on
       a line -- the defining difference from engraving -->
  <path d="M6.6 2 L10.6 2 L10.6 9 L8.6 13 L6.6 9 Z" fill="#4cc9f0" fill-opacity="0.18" stroke="#4cc9f0" stroke-width="1.3"/>
</svg>
