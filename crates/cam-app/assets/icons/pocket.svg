<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" stroke-linejoin="round" stroke-linecap="round">
  <!-- isometric stock block, shaded for depth -->
  <path d="M4 7 L4 16 L12 20 L12 11 Z" fill="#e0e0e0" fill-opacity="0.06"/>
  <path d="M20 7 L20 16 L12 20 L12 11 Z" fill="#e0e0e0" fill-opacity="0.13"/>
  <path d="M12 3 L20 7 L12 11 L4 7 Z" fill="#e0e0e0" fill-opacity="0.20"/>
  <path d="M12 3 L20 7 L20 16 L12 20 L4 16 L4 7 Z M12 11 L12 20 M4 7 L12 11 L20 7" fill="none" stroke="#e0e0e0" stroke-width="1.6"/>
  <!-- recess interior walls (dark = looking down into the cavity) -->
  <path d="M12 4.4 L7.5 6.6 L9 9.4 L12 7.9 Z" fill="#101216" fill-opacity="0.45"/>
  <path d="M12 4.4 L16.5 6.6 L15 9.4 L12 7.9 Z" fill="#101216" fill-opacity="0.30"/>
  <!-- pocket floor -->
  <path d="M12 7.9 L15 9.4 L12 10.9 L9 9.4 Z" fill="#4cc9f0" fill-opacity="0.42" stroke="#4cc9f0" stroke-width="1.2"/>
  <!-- opening rim on the top face -->
  <path d="M7.5 6.6 L12 4.4 L16.5 6.6 L12 8.8 Z" fill="none" stroke="#e0e0e0" stroke-width="1.3"/>
  <!-- back corner drop -->
  <path d="M12 4.4 L12 7.9" stroke="#e0e0e0" stroke-width="1.1" stroke-opacity="0.8"/>
</svg>
