<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" stroke-linejoin="round" stroke-linecap="round">
  <!-- part cross-section with a V-groove ploughed into the top face -->
  <path d="M3 11 L9 11 L12 16 L15 11 L21 11 L21 21 L3 21 Z" fill="#e0e0e0" fill-opacity="0.13" stroke="#e0e0e0" stroke-width="1.6"/>
  <!-- the engraved groove flanks, highlighted -->
  <path d="M9 11 L12 16 L15 11" fill="none" stroke="#4cc9f0" stroke-width="1.8"/>
  <!-- V-bit descending into the groove: shank flaring into a cutting point -->
  <path d="M9.6 2 L14.4 2 L14.4 9 L12 13 L9.6 9 Z" fill="#4cc9f0" fill-opacity="0.18" stroke="#4cc9f0" stroke-width="1.3"/>
</svg>
