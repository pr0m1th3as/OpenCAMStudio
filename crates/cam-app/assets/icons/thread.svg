<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" stroke-linejoin="round" stroke-linecap="round">
  <!-- machine screw: head + threaded shank -->
  <!-- head -->
  <rect x="7.8" y="2.5" width="8.4" height="4" rx="1" fill="#e0e0e0" fill-opacity="0.12" stroke="#e0e0e0" stroke-width="1.6"/>
  <!-- drive slot -->
  <path d="M12 2.5 L12 6.5" stroke="#e0e0e0" stroke-width="1.2"/>
  <!-- threaded shank tapering to a point -->
  <path d="M9.4 6.5 L14.6 6.5 L14.6 16 L12 20.5 L9.4 16 Z" fill="#e0e0e0" fill-opacity="0.07" stroke="#e0e0e0" stroke-width="1.6"/>
  <!-- thread crests -->
  <path d="M9.4 9 L14.6 9 M9.4 11.2 L14.6 11.2 M9.4 13.4 L14.6 13.4 M10 15.6 L14 15.6" stroke="#4cc9f0" stroke-width="1.3"/>
</svg>
