  <!-- Author: Andreas Bertsatos. Licence: CC BY-SA 4.0 International.

       This file is a deliberate exception to OpenCAMStudio's GPL-3.0-only licence,
       and the only one. CC BY-SA 4.0 is what Wikipedia and Wikimedia Commons run
       on, so licensing the application icon this way is what allows it to be used
       and attributed there. Compatibility is one-way: BY-SA material may be used in
       a GPLv3 work, never the reverse, so this file cannot later be relicensed to
       match the GPL-3.0 ribbon icons.

       The lettering is outline paths, not live text, and must stay that way: as a
       text element the file rendered differently depending on what opened it, and
       the Linux, macOS and Windows packaging runners would each resolve a generic
       font family to a different face. Outlines render identically everywhere and
       need no installed font. Letterforms derive from DejaVu Sans Bold.

       Depth cue: with light from the upper left a recessed groove is shadowed on
       its upper-left wall and lit on the lower-right, so the dark pass is offset
       up-slope and the bright pass sits on the nominal line. Reversing the two
       reads as embossed, the opposite of engraved. -->

